# Программа внутреннего аудита.
#
# Программа — это не список пожеланий, а набор ПРОВЕРОК: что смотрим, как
# смотрим, какое доказательство ожидаем получить, и что именно эта проверка
# подтверждает.
#
# Поле verifies — ключевое. Оно связывает проверку с мерой или с ответом
# на вопросник. Из этого связи работают две вещи:
#   вперёд  — по находке видно, какую меру она затрагивает;
#   назад   — видно, какая мера не проверяется НИКОГДА, и это самая опасная
#             находка из возможных: мера существует только на бумаге.
#
# Программа без поля verifies превращается в общий чек-лист, который
# проверяет всё и ничего.

program:
  # ── Доступ и данные ───────────────────────────────────────────────────────
  - id: au-access-review
    area: Доступ
    objective: Убедиться, что права соответствуют ролям, а лишние сняты
    how: Выбрать 5 учётных записей, сверить с текущими ролями и датой последнего пересмотра
    evidence_expected: отчёт пересмотра прав за квартал
    verifies: ans-access-control
    frequency: quarterly

  - id: au-encryption-check
    area: Защита данных
    objective: Подтвердить, что шифрование включено и ключи хранятся отдельно от данных
    how: Проверить настройки хранилища и место хранения ключей; убедиться, что резервные копии шифруются
    evidence_expected: снимок настроек и схема обращения с ключами
    verifies: ans-encryption
    frequency: semiannual

  - id: au-retention-check
    area: Сроки хранения
    objective: Убедиться, что сроки заданы для всех категорий данных и соблюдаются
    how: Сверить категории данных из реестра обработки со сроками; найти категории без срока
    evidence_expected: перечень категорий со сроками и отметкой о соблюдении
    verifies: ans-retention
    frequency: quarterly

  - id: au-log-redaction
    area: Журналирование
    objective: Подтвердить, что персональные данные не попадают в журналы
    how: Выборка 500 записей журнала, поиск адресов почты, телефонов и идентификаторов
    evidence_expected: результат выборки с числом найденных записей
    verifies: ctl-log-redaction
    frequency: monthly

  # ── Искусственный интеллект ──────────────────────────────────────────────
  - id: au-injection-eval
    area: Устойчивость ИИ
    objective: Подтвердить, что защита от подмены инструкций измерена и не деградировала
    how: Прогнать набор векторов, сверить с прошлым прогоном, разобрать неоднозначные исходы
    evidence_expected: файл прогона security/evals/<цель>-<дата>.yaml
    verifies: ctl-injection-filter
    frequency: monthly

  - id: au-bias-testing
    area: Справедливость ИИ
    objective: Убедиться, что тест на смещение проводится и порог соблюдается
    how: Проверить свежесть прогона, разрыв в доле отбора по группам, соответствие порогу из политики
    evidence_expected: протокол прогона с числами по группам
    verifies: ctl-cv-bias-testing
    frequency: quarterly

  - id: au-ai-act-register
    area: AI Act
    objective: Убедиться, что классификация проведена и обоснования актуальны
    how: Сверить состав систем с реестром; проверить наличие обоснования и даты пересмотра по каждой
    evidence_expected: реестр ИИ-систем с заполненными полями классификации
    verifies: ans-ai-act
    frequency: semiannual

  - id: au-human-oversight
    area: Надзор человека
    objective: Подтвердить, что решение системы не является окончательным
    how: Взять выборку отклонённых решений и убедиться, что каждое просмотрено человеком и это зафиксировано
    evidence_expected: выборка решений с отметкой о пересмотре
    verifies: ans-human-oversight
    frequency: quarterly

  # ── Эксплуатация ──────────────────────────────────────────────────────────
  - id: au-ropa-review
    area: Приватность
    objective: Убедиться, что реестр обработки полон и по каждой операции задан срок хранения
    how: Сверить состав операций с фактической обработкой; найти операции без срока или с основанием, не подтверждённым практикой
    evidence_expected: реестр обработки с заполненными основаниями и сроками
    verifies: ans-ropa
    frequency: semiannual

  - id: au-dsr-timeliness
    area: Права субъектов
    objective: Подтвердить, что запросы обрабатываются в срок и доказательства сохраняются
    how: Проверить незакрытые запросы на приближение срока; по закрытым — наличие доказательства и соблюдение даты
    evidence_expected: реестр запросов с доказательствами по каждому
    verifies: ans-dsr-process
    frequency: quarterly

  - id: au-incident-drill
    area: Реагирование
    objective: Убедиться, что порядок реагирования существует и применим
    how: Проверить дату последних учений; при отсутствии за полгода — назначить
    evidence_expected: протокол учений
    verifies: ans-incident-response
    frequency: semiannual

  - id: au-subprocessors
    area: Третьи стороны
    objective: Подтвердить, что по каждому субподрядчику есть действующее соглашение
    how: Сверить перечень субподрядчиков с базой соглашений; найти расхождения и просроченные
    evidence_expected: перечень субподрядчиков со статусом соглашений
    verifies: ans-subprocessors
    frequency: semiannual

  - id: au-personnel-training
    area: Персонал
    objective: Убедиться, что обучение пройдено всеми, кому положено
    how: Сверить список сотрудников с журналом обучения; выделить непрошедших более года
    evidence_expected: журнал обучения с датами
    verifies: ans-personnel
    frequency: annual

  - id: au-pentest-status
    area: Внешняя проверка
    objective: Убедиться, что внешнее тестирование проводится, и видеть пробелы
    how: Проверить дату и охват последнего отчёта; отдельно — покрыты ли ИИ-компоненты
    evidence_expected: отчёт внешнего тестирования
    verifies: ans-pentest
    frequency: annual
