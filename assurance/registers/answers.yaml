# Библиотека ответов на security-вопросники.
#
# Смысл: клиенты спрашивают одно и то же разными словами. Отвечать каждый раз
# заново — это часы работы и расхождения между ответами разным клиентам.
# Здесь ответ даётся один раз, с доказательством, и переиспользуется.
#
# Каждый ответ опирается на доказательство — файл, который существует.
# Ответ без доказательства не проходит проверку, и это принципиально:
# «да, мы шифруем данные» без ссылки на процедуру — это обещание.
#
# status: yes — выполняем; partial — выполняем частично (нужен remediation);
#         no — не выполняем; na — неприменимо.

answers:
  # ── Доступ ────────────────────────────────────────────────────────────────
  - id: ans-access-control
    topic: доступ
    intent: Кто имеет доступ к системам и как доступ ограничен
    status: yes
    owner: Security Lead
    reviewed: 2026-10-01
    evidence: assurance/evidence/ans-access-control.md
    answer: |
      Доступ предоставляется по ролям и только в объёме, необходимом для
      выполнения обязанностей. Пересмотр прав проводится ежеквартально,
      при увольнении доступ снимается в течение рабочего дня.

  # ── Защита данных ─────────────────────────────────────────────────────────
  - id: ans-encryption
    topic: шифрование
    intent: Шифруются ли данные при передаче и хранении
    status: yes
    owner: Security Lead
    reviewed: 2026-10-01
    evidence: assurance/evidence/ans-encryption.md
    answer: |
      Данные шифруются при передаче (TLS 1.2 и выше) и при хранении
      (шифрование диска и резервных копий). Ключи хранятся отдельно
      от данных.

  - id: ans-retention
    topic: сроки хранения
    intent: Как определяются и соблюдаются сроки хранения данных
    status: partial
    owner: Privacy Lead
    reviewed: 2026-10-01
    evidence: assurance/evidence/ans-retention.md
    remediation: Сроки заданы в реестре обработки для всех операций, но для журналов доступа срок ещё не установлен; закрытие запланировано на 2026-12-01
    answer: |
      Сроки хранения заданы по каждой операции в реестре обработки и указаны
      явно. Пробел: для журналов доступа срок не установлен — это известный
      пробел с датой закрытия.

  # ── Искусственный интеллект ──────────────────────────────────────────────
  - id: ans-ai-act
    topic: AI Act
    intent: Проведена ли классификация ИИ-систем по AI Act
    status: yes
    owner: Compliance Lead
    reviewed: 2026-10-01
    evidence: assurance/evidence/ans-ai-act.md
    answer: |
      Каждая ИИ-система классифицирована, класс и обоснование зафиксированы
      в реестре ИИ-систем. Для систем высокого риска ведётся техническая
      документация и назначен ответственный за надзор.

  - id: ans-prompt-injection
    topic: устойчивость к манипуляции
    intent: Проверяется ли защита от подмены инструкций
    status: yes
    owner: Security Lead
    reviewed: 2026-10-16
    evidence: assurance/evidence/ctl-injection-filter.md
    answer: |
      Устойчивость измеряется прогоном набора векторов (16 атак, 6 классов).
      Результат фиксируется файлом прогона, регрессия отслеживается
      автоматически. Прогон повторяется при изменении промпта или прав.

  - id: ans-human-oversight
    topic: надзор человека
    intent: Остаётся ли решение модели под контролем человека
    status: yes
    owner: Head of People
    reviewed: 2026-10-01
    evidence: assurance/evidence/sys-cv-screening-human-oversight.md
    answer: |
      Решение системы не является окончательным: отклонившиеся кандидаты
      просматриваются человеком. Порядок пересмотра зафиксирован,
      ответственный назначен.

  # ── Эксплуатация ──────────────────────────────────────────────────────────
  - id: ans-logging
    topic: журналирование
    intent: Ведутся ли журналы событий и защищены ли они
    status: yes
    owner: Security Lead
    reviewed: 2026-10-01
    evidence: assurance/evidence/sys-cv-screening-logging.md
    answer: |
      Ведутся журналы доступа и действий. Персональные данные перед записью
      обезличиваются. Доступ к журналам ограничен, изменения фиксируются.

  - id: ans-incident-response
    topic: реагирование на инциденты
    intent: Есть ли порядок действий при инциденте
    status: yes
    owner: Security Lead
    reviewed: 2026-10-01
    evidence: assurance/evidence/ans-incident-response.md
    answer: |
      Порядок реагирования определён: обнаружение, локализация, оценка
      воздействия, уведомление затронутых сторон в установленные сроки,
      разбор причин. Контакт для сообщений доступен круглосуточно.

  - id: ans-subprocessors
    topic: субподрядчики
    intent: Привлекаются ли третьи стороны и как они контролируются
    status: yes
    owner: Compliance Lead
    reviewed: 2026-10-01
    evidence: assurance/evidence/ans-subprocessors.md
    answer: |
      Перечень субподрядчиков ведётся и доступен клиенту. С каждым заключено
      соглашение об обработке данных. О новых субподрядчиках клиент
      уведомляется заранее.

  - id: ans-personnel
    topic: персонал
    intent: Обучается ли персонал вопросам безопасности и приватности
    status: yes
    owner: Compliance Lead
    reviewed: 2026-10-01
    evidence: assurance/evidence/ans-personnel.md
    answer: |
      При приёме на работу проводится инструктаж, далее — ежегодное обучение
      с проверкой. Прохождение фиксируется.

  - id: ans-pentest
    topic: тестирование на проникновение
    intent: Проводится ли независимая проверка защищённости
    status: partial
    owner: Security Lead
    reviewed: 2026-10-01
    evidence: assurance/evidence/ans-pentest.md
    remediation: Независимое тестирование ИИ-компонентов не проводилось; запланировано на 2027-Q1
    answer: |
      Тестирование инфраструктуры проводится ежегодно внешним подрядчиком.
      Тестирование ИИ-компонентов пока выполняется только внутренними
      прогонами атак.

  # ── Приватность ───────────────────────────────────────────────────────────
  - id: ans-ropa
    topic: реестр обработки
    intent: Ведётся ли реестр обработки персональных данных
    status: yes
    owner: Privacy Lead
    reviewed: 2026-10-16
    evidence: assurance/evidence/ans-ropa.md
    answer: |
      По каждой операции обработки зафиксированы цель, правовое основание,
      категории данных, получатели, срок хранения и наличие передачи
      за границу. Реестр пересматривается по каждой операции ежегодно.

  - id: ans-dsr-process
    topic: права субъектов
    intent: Как обрабатываются запросы субъектов данных и соблюдаются ли сроки
    status: yes
    owner: Privacy Lead
    reviewed: 2026-10-16
    evidence: assurance/evidence/ans-dsr.md
    answer: |
      Запросы субъектов регистрируются, личность подтверждается, ответ даётся
      в установленный срок. По каждому запросу сохраняется доказательство
      обработки. Сроки отслеживаются автоматически: незакрытый запрос
      с истёкшим сроком виден проверке.
