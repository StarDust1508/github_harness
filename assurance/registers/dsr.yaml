# Запросы субъектов данных (DSR).
#
# Субъект — это человек, о котором вы обрабатываете данные. У него есть права:
# узнать, что о нём есть; исправить; удалить; получить копию; возразить против
# обработки. Запрос по каждому праву имеет СРОК, и срок юридически значим.
#
# Проверка следит за сроками у незакрытых запросов. Просроченный и закрытый
# запрос нарушением не является — для этого у правила есть оговорка unless_in.
#
# Субъект обозначается идентификатором, а не именем: реестр должен позволять
# доказать соблюдение срока, не раскрывая лишних персональных данных. Это
# принцип минимизации, применённый к самому реестру.
#
# Строка evidence — доказательство того, что запрос обработан: переписка,
# выгрузка, отметка об удалении. Запрос без доказательства недоказуем.

