# Находки внутреннего аудита.
#
# Находка без проверяющего и без срока — это жалоба, а не находка.
# Проверка следит, чтобы у каждой были severity, статус, срок и тот,
# кто закроет.
#
# Поле test связывает находку с процедурой программы аудита: видно, из какой
# проверки она пришла. Без этой связи через полгода невозможно понять,
# находка случайная или проверка систематически не срабатывает.

findings:
  - id: find-2026-01
    title: В журналах приложения встречаются неотредактированные адреса почты
    control: ctl-log-redaction
    test: au-log-redaction
    severity: major
    status: in_progress
    due: 2026-11-15
    verifier: Security Lead
