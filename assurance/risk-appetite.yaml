# Аппетит к риску и шкала оценки.
#
# Это ПРИМЕР. Замените пороги на свои: аппетит — решение организации,
# а не универсальная норма. Здесь важна форма, а не конкретные числа.
#
# Смысл файла: отделить «риск, с которым живут осознанно» от «риск, о котором
# забыли». Первое — управленческое решение с именем и датой. Второе — то,
# что находят на внешнем аудите.

# ── Шкала ───────────────────────────────────────────────────────────────────
# Оценка идёт по двум осям. Уровень риска — их пересечение.
scale:
  likelihood:
    - value: low
      meaning: Событие маловероятно в горизонте года; прецедентов не было
    - value: medium
      meaning: Событие возможно раз в год; прецеденты в отрасли есть
    - value: high
      meaning: Событие ожидаемо в горизонте года; прецеденты у нас были
  impact:
    - value: low
      meaning: Ущерб устраняется в рабочем порядке, уведомления не требуются
    - value: medium
      meaning: Требуется раскрытие затронутым сторонам или регулятору
    - value: high
      meaning: Остановка деятельности, существенный штраф или утрата данных

# Пересечение осей. Строки — вероятность, столбцы — воздействие.
matrix:
  low:
    low: low
    medium: low
    high: medium
  medium:
    low: low
    medium: medium
    high: high
  high:
    low: medium
    medium: high
    high: high

# ── Аппетит ─────────────────────────────────────────────────────────────────
appetite:
  # Уровни, с которыми организация живёт без отдельного решения:
  # достаточно обработки владельцем риска.
  accept_without_decision:
    - low
  # Уровни, требующие явного принятия. Жить с таким риском можно,
  # но это решение, у которого есть имя, причина и дата.
  require_explicit_acceptance:
    - medium
    - high
  # Кто вправе принять. Проверкой не контролируется — это управленческое
  # правило, а не свойство данных; но ответ на вопрос аудитора «кто это
  # разрешил» должен находиться в реестре.
  authority:
    medium: Владелец риска
    high: Руководство

# ── Пересмотр ───────────────────────────────────────────────────────────────
review:
  # Риск без даты пересмотра — забытый риск.
  max_interval_days: 180
  # Риск, принятый к сведению, пересматривается чаще: обстоятельства меняются.
  accepted_max_interval_days: 90
