# Правила проверки реестров.
#
# Это данные, а не код: чтобы добавить новую предметную область, достаточно
# дописать сюда раздел. Программировать ничего не нужно.
#
# Пять конструкций, больше нет намеренно:
#   require     — поля, которые обязаны быть заполнены
#   require_if  — поля, обязательные при условии (например, при высоком риске)
#   one_of      — допустимые значения поля
#   ref         — ссылка на запись другого реестра
#   not_past    — дата, которая не должна быть в прошлом
#
# Юридическое содержание (какие именно артефакты требует AI Act) — предмет
# проверки юристом. Здесь зафиксирована structure: что должно существовать,
# чтобы утверждение о соответствии можно было проверить.

registers:
  systems:
    title: Реестр ИИ-систем
    file: assurance/registers/systems.yaml
    require:
      - id
      - name
      - purpose
      - role
      - risk_class
      - classification_reason
      - owner
      - next_review
    checks:
      - kind: one_of
        field: role
        values:
          - provider
          - deployer
          - both
      - kind: one_of
        field: risk_class
        values:
          - prohibited
          - high
          - limited
          - minimal
      # Высокорисковая система без этих артефактов не может считаться
      # соответствующей: проверять нечего.
      - kind: require_if
        field: risk_class
        equals: high
        require:
          - technical_doc
          - risk_management
          - data_governance
          - human_oversight
          - logging
          - accuracy_robustness
      - kind: not_past
        field: next_review

  risks:
    title: Реестр рисков
    file: assurance/registers/risks.yaml
    require:
      - id
      - title
      - system
      - owner
      - likelihood
      - impact
      - treatment
      - residual
      - next_review
    checks:
      - kind: ref
        field: system
        register: systems
      # Оценка по шкале из risk-appetite.yaml. Без неё решение об уровне
      # риска невозможно проверить, а через полгода — и понять.
      - kind: one_of
        field: likelihood
        values:
          - low
          - medium
          - high
      - kind: one_of
        field: impact
        values:
          - low
          - medium
          - high
      - kind: one_of
        field: treatment
        values:
          - mitigate
          - accept
          - transfer
          - avoid
      - kind: one_of
        field: residual
        values:
          - low
          - medium
          - high
      - kind: not_past
        field: next_review
      # Жить с риском выше аппетита можно, но это РЕШЕНИЕ, и оно записано:
      # у него есть имя и причина. Риск без принятия — не «принятый риск»,
      # а забытый, и на внешнем аудите это находка.
      - kind: require_if
        field: residual
        in:
          - medium
          - high
        require:
          - accepted_by
          - acceptance_reason

  controls:
    title: Реестр мер и доказательств
    file: assurance/registers/controls.yaml
    require:
      - id
      - title
      - risk
      - policy
      - owner
      - evidence
    checks:
      - kind: ref
        field: risk
        register: risks
      # Мера без доказательства — это намерение, а не мера.
      - kind: evidence
        field: evidence
      # Каждая мера опирается на политику: мера без основания — самодеятельность,
      # которая исчезнет при смене человека.
      - kind: ref
        field: policy
        register: policies
      # Мера, которую не проверяет ни одна процедура, существует на бумаге.
      - kind: covered_by
        register: audit-program
        field: verifies
        reason: не проверяется ни одной процедурой аудита

  # ── Ответы на security-вопросники ────────────────────────────────────────
  #
  # Тот же движок правил, что у реестров: новый код не потребовался.
  # Вопросник — это реестр, чьи записи ссылаются на библиотеку ответов.
  answers:
    title: Библиотека ответов
    file: assurance/registers/answers.yaml
    require:
      - id
      - topic
      - intent
      - status
      - owner
      - reviewed
      - answer
    checks:
      - kind: one_of
        field: status
        values:
          - yes
          - partial
          - no
          - na
      # «Да, мы это делаем» без доказательства — обещание, а не ответ.
      - kind: evidence
        field: evidence
      # Частичное выполнение без плана закрытия — это отказ, замаскированный
      # под прогресс. Клиент имеет право видеть срок.
      - kind: require_if
        field: status
        equals: partial
        require:
          - remediation

  questionnaire-example:
    title: Вопросник клиента (пример)
    file: assurance/registers/questionnaires/example.yaml
    require:
      - id
      - question
      - answer
    checks:
      # Вопрос без ответа — незакрытый вопросник.
      - kind: ref
        field: answer
        register: answers

  # ── Приватность ──────────────────────────────────────────────────────────
  policies:
    title: Реестр политик
    file: assurance/registers/policies.yaml
    require:
      - id
      - title
      - requirement
      - owner
      - approved
      - next_review
      - scope
      - addresses
      - evidence
    checks:
      # Каждая ссылка списка: потеря одного риска не должна проходить незамеченной.
      - kind: ref_each
        field: addresses
        register: risks
      - kind: evidence
        field: evidence
      - kind: not_past
        field: next_review
      # Политика, которую не реализует ни одна мера, — украшение. Это самая
      # частая форма бумажной системы управления: документ есть, применения нет.
      - kind: covered_by
        register: controls
        field: policy
        reason: ни одна мера не реализует эту политику — документ без применения

  processing:
    title: Реестр обработки персональных данных
    file: assurance/registers/processing.yaml
    require:
      - id
      - title
      - purpose
      - legal_basis
      - data_categories
      - subjects
      - recipients
      - retention_period
      - owner
      - next_review
    checks:
      # Основания обработки. Список — по GDPR; для 152-ФЗ он свой,
      # и его нужно заменить в этом месте, а не в коде.
      - kind: one_of
        field: legal_basis
        values:
          - consent
          - contract
          - legal_obligation
          - vital_interests
          - public_task
          - legitimate_interests
      - kind: ref
        field: system
        register: systems
      - kind: one_of
        field: transfer_outside
        values:
          - none
          - third_country
          - international_org
      # Передача за границу без основания — самая дорогая находка в приватности.
      - kind: require_if
        field: transfer_outside
        in:
          - third_country
          - international_org
        require:
          - transfer_basis
      - kind: not_past
        field: next_review

  dsr:
    title: Запросы субъектов данных
    file: assurance/registers/dsr.yaml
    require:
      - id
      - received
      - subject_ref
      - kind
      - deadline
      - status
      - owner
      - evidence
    checks:
      - kind: one_of
        field: kind
        values:
          - access
          - erasure
          - rectification
          - portability
          - objection
          - restriction
      - kind: one_of
        field: status
        values:
          - received
          - in_progress
          - answered
          - refused
          - closed
      # Запрос без доказательства обработки недоказуем.
      - kind: evidence
        field: evidence
      # Срок значим, пока запрос не закрыт. Закрытый в срок запрос
      # с прошедшей датой — не нарушение.
      - kind: not_past
        field: deadline
        unless_in:
          - closed
          - refused

  audit-program:
    title: Программа внутреннего аудита
    file: assurance/audit-program.yaml
    require:
      - id
      - area
      - objective
      - how
      - evidence_expected
      - verifies
      - frequency
    checks:
      - kind: one_of
        field: frequency
        values:
          - monthly
          - quarterly
          - semiannual
          - annual
      # Проверка без привязки к мере или ответу превращается в общий чек-лист,
      # который проверяет всё и ничего.
      - kind: ref_any
        field: verifies
        registers:
          - controls
          - answers

  findings:
    title: Находки внутреннего аудита
    file: assurance/registers/findings.yaml
    require:
      - id
      - title
      - control
      - test
      - severity
      - status
      - due
      - verifier
    checks:
      - kind: ref
        field: control
        register: controls
      - kind: ref
        field: test
        register: audit-program
      - kind: one_of
        field: severity
        values:
          - critical
          - major
          - minor
          - observation
      - kind: one_of
        field: status
        values:
          - open
          - in_progress
          - closed
          - accepted
      # Находка со сроком, который прошёл, и статусом «в работе» — это находка,
      # которую решили не замечать. Закрытая и принятая к сведению не в счёт.
      - kind: not_past
        field: due
        unless_in:
          - closed
          - accepted
