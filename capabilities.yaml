# Маршрутизатор обвязки.
#
# Проблема, которую он решает: агент видит описания скиллов, но НЕ видит, что
# умеет сама обвязка. Команда, о существовании которой агент не знает, для него
# не существует — ровно как скилл с описанием без «когда».
#
# Поэтому каждая возможность объявляет четыре вещи:
#   цель      — что она даёт на выходе
#   когда     — при каких признаках задачи её звать
#   не когда  — когда она только добавит шума
#   вызов     — точная команда
#
# Файл читается генератором точки входа: маршрут попадает агенту автоматически
# и не может устареть отдельно от кода.

capabilities:
  - id: check
    title: Проверка реестров assurance
    purpose: Убедиться, что утверждения о соответствии подкреплены доказательствами, владельцами и сроками
    when:
      - перед сдачей реестра аудитору или клиенту
      - после любой правки регистров assurance
      - при подготовке ответа на security-вопросник
    not_when:
      - реестры ещё пустые — проверять нечего
    invoke: tools/harness check
    audience: agent

  - id: questionnaire
    title: Ответы на security-вопросник
    purpose: Собрать ответы клиенту из библиотеки с доказательствами и проверить перед отправкой
    when:
      - пришёл вопросник от клиента, заказчика или при тендере
      - нужно убедиться, что ответы разным клиентам не расходятся
    not_when:
      - вопрос про конкретную уязвимость — это прогон атак, а не вопросник
    invoke: tools/harness check <вопросник>
    audience: agent

  - id: eval
    title: Прогон атак на ИИ-приложение
    purpose: Измерить устойчивость цели к подмене инструкций, джейлбрейкам и утечкам и получить доказательство для меры защиты
    when:
      - нужно проверить устойчивость агента или чат-бота
      - менялся промпт, права инструментов или фильтры — нужна регрессия
      - нужен отчёт как доказательство для реестра assurance
    not_when:
      - нет разрешения владельца цели
      - цель не готова: её нельзя вызвать и получить ответ
    invoke: tools/harness eval <цель>
    audience: agent

  - id: session-stats
    title: Диагностика поведения агента
    purpose: Показать по журналам сессий, где инструменты отказывают и есть ли регрессия
    when:
      - агент «не берёт инструменты» или обещает без результата
      - результат хуже ожидаемого и непонятно почему
      - нужно доказать улучшение или ухудшение числом
    not_when:
      - вопрос про конкретный код, а не про поведение агента
    invoke: tools/session-stats --days 14
    audience: agent

  - id: scan
    title: Разведка перед переносом
    purpose: Показать, что переносимо, что требует санитизации и где секреты
    when:
      - нужно перенести скиллы или документы в обвязку
      - перед публикацией внешнего материала
    not_when:
      - материал уже в ядре и проверен
    invoke: tools/harness scan <каталог> [--docs]
    audience: agent

  - id: import
    title: Перенос в ядро
    purpose: Перенести скилл или документ с проверками и обезличиванием путей
    when:
      - разведка показала, что материал чист
    not_when:
      - разведка не проводилась
    invoke: tools/harness import <путь> [--doc --layer <слой>]
    audience: agent

  - id: new
    title: Заготовка скилла
    purpose: Создать скилл вместе с полями замера, чтобы порог доказательности соблюдался по умолчанию
    when:
      - появилась повторяющаяся процедура, которой ещё нет в ядре
    not_when:
      - процедура разовая; или уже есть готовый скилл в маркетплейсе
    invoke: tools/harness new <имя-kebab-case>
    audience: agent

  - id: verify
    title: Самопроверка перед публикацией
    purpose: Проверить, что в репозиторий не уедут секреты, личные пути и битые ссылки
    when:
      - перед коммитом и перед публикацией
    not_when:
      - никогда: это дешёвая проверка, её пропускать не нужно
    invoke: tools/harness verify
    audience: agent

  - id: doctor
    title: Целостность обвязки
    purpose: Проверить ядро, ссылки в инструментах и соответствие манифеста реальности
    when:
      - что-то работает не так, как ожидается
      - после изменения манифеста или установки
    not_when:
      - задача не касается обвязки
    invoke: tools/harness doctor
    audience: agent

  - id: install
    title: Подключение ядра к инструментам
    purpose: Разложить ссылки на скиллы по местам, которые читает каждый инструмент
    when:
      - добавлены или изменены скиллы ядра
      - обвязка разворачивается на новой машине
    not_when:
      - нужны только правила: они подключаются командой entrypoint
    invoke: tools/harness install all
    audience: человек

  - id: entrypoint
    title: Точка входа для файла инструкций
    purpose: Записать короткий указатель на ядро туда, откуда инструмент читает инструкции
    when:
      - новая машина или новый инструмент
      - состав правил заметно изменился
    not_when:
      - у инструмента уже есть свой файл инструкций: он не перезаписывается
    invoke: tools/harness entrypoint --write
    audience: человек

  - id: bootstrap
    title: Развёртывание на новой машине
    purpose: Проверить окружение, развернуть обвязку и проверить результат одной командой
    when:
      - новая машина, чистый клон репозитория
    not_when:
      - обвязка уже развёрнута и работает
    invoke: tools/bootstrap
    audience: человек
