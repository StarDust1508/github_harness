# Цели для прогона атак.
#
# Механика одна: обвязка ЗАПУСКАЕТ КОМАНДУ. Как устроена команда — дело
# владельца цели: curl, свой скрипт, локальный агент. Обвязка не знает
# про HTTP и не знает про конкретные инструменты — она передаёт полезную
# нагрузку и читает ответ.
#
# Нагрузка передаётся двумя способами одновременно:
#   переменная окружения HARNESS_ATTACK — для скриптов;
#   стандартный ввод                   — для программ, читающих поток.
# Подстановка в командную строку не используется намеренно: это ломается
# на кавычках и открывает инъекцию в саму обвязку.
#
# Два вида целей:
#   chat   — принимает полезную нагрузку, возвращает ответ. Прогоняются атаки.
#   static — разовая проверка файлов: конфигурации, промпты, права. Отвечает
#            один раз, без нагрузки. Атаки к ней неприменимы, и это честнее,
#            чем делать вид, что джейлбрейк применим к файлу на диске.

targets:
  # ── Самопроверка: прогонщик проверяет сам себя ────────────────────────────
  - id: self-test
    title: Самопроверка прогонщика
    kind: chat
    command: security/targets/mock-chat.sh
    timeout: 20
    note: Заглушка с тремя известными поведениями. Ожидаемый итог — 1 пробито, 1 на разбор, 14 удержано. Если числа другие, сломался прогонщик.
  # ── Пример: HTTP-эндпоинт ─────────────────────────────────────────────────
  - id: example-http
    title: HTTP-эндпоинт (пример)
    kind: chat
    command: security/targets/http-chat.sh
    timeout: 60
    # Переменные передаются скрипту, чтобы он знал, куда идти.
    env:
      TARGET_URL: http://127.0.0.1:8080/chat
    note: Пример. Укажите свой адрес и поправьте скрипт под формат вашего API.

  # ── Пример: локальный CLI-агент ───────────────────────────────────────────
  - id: example-cli-agent
    title: Локальный CLI-агент (пример)
    kind: chat
    command: security/targets/cli-agent.sh
    timeout: 300
    env:
      AGENT_CMD: dsh
      AGENT_ARGS: --profile headless
    note: Свою машину ломать можно свободно — разрешение не нужно.

  # ── Пример: проверка файлов ───────────────────────────────────────────────
  - id: example-static
    title: Проверка конфигураций и промптов (пример)
    kind: static
    command: security/targets/static-check.sh
    timeout: 60
    env:
      SCAN_ROOT: .
    note: Ищет то, что не видно в диалоге — открытые ключи, права без подтверждения, промпты в открытом виде.
